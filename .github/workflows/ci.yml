name: CI

on:
  push:
  pull_request:

jobs:
  ai-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn "pydantic>=2" pydantic-settings \
            langgraph langgraph-checkpoint-sqlite alpaca-py mcp httpx python-dotenv \
            pytest pytest-asyncio ruff
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test
        run: pytest -q

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aura_test
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aura -d aura_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, zip
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint (Pint)
        run: vendor/bin/pint --test
      - name: Migrate
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aura_test
          DB_USERNAME: aura
          DB_PASSWORD: aura
        run: php artisan migrate --force
      - name: Test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aura_test
          DB_USERNAME: aura
          DB_PASSWORD: aura
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [ai-engine, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images (no push)
        run: docker compose -f compose.yml build
