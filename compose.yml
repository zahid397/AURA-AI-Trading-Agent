name: aura

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aura}
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_dev_only}
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - aura_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi.Dockerfile
    env_file: [ai-engine/.env]
    environment:
      LARAVEL_INTERNAL_BASE_URL: http://laravel:8000/api/internal/v1
    volumes:
      - aura_langgraph_checkpoints:/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  laravel:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
    env_file: [backend/.env]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-aura}
      DB_USERNAME: ${POSTGRES_USER:-aura}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aura_dev_only}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      AI_ENGINE_BASE_URL: http://fastapi:8001
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:8080,localhost:5173,localhost,127.0.0.1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
    env_file: [backend/.env]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-aura}
      DB_USERNAME: ${POSTGRES_USER:-aura}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aura_dev_only}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      AI_ENGINE_BASE_URL: http://fastapi:8001
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5"]
    depends_on:
      laravel: { condition: service_healthy }

  scheduler:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
    env_file: [backend/.env]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-aura}
      DB_USERNAME: ${POSTGRES_USER:-aura}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aura_dev_only}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      AI_ENGINE_BASE_URL: http://fastapi:8001
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      laravel: { condition: service_healthy }

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      laravel: { condition: service_healthy }
    ports:
      - "8080:80"
    healthcheck:
      # 127.0.0.1, not localhost -- see docker/frontend.Dockerfile's
      # HEALTHCHECK comment (this compose-level override was the same bug,
      # a second copy of it: this healthcheck: block takes precedence over
      # the image's own baked-in HEALTHCHECK, so fixing only one of the two
      # left the container reporting unhealthy despite serving traffic fine).
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aura_postgres_data:
  aura_redis_data:
  aura_langgraph_checkpoints:
