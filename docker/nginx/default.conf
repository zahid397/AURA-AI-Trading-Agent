# Serves the built Vue SPA and reverse-proxies Laravel's public API + Sanctum
# CSRF/session routes. The FastAPI ai-engine and the Laravel<->FastAPI
# internal signed API are NEVER exposed here — the browser must never be
# able to reach either directly (see docs/architecture.md's trust-boundary
# rule).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /sanctum/ {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cookie_path / /;
    }

    location = /up {
        proxy_pass http://laravel:8000/up;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
